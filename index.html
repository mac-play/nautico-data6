<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout Exclusivo | Náutico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --card-border: #222222;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --neon-red: #ff1e38;
            --neon-glow: rgba(255, 30, 56, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0 20px 0;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-glow);
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .search-container {
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            padding: 14px 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            border-color: var(--neon-red);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .atleta-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }

        .atleta-card:hover {
            border-color: #444;
        }

        .atleta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .atleta-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .atleta-info span {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .atleta-geral-badge {
            background: rgba(255, 30, 56, 0.1);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 0 8px var(--neon-glow);
            white-space: nowrap;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--card-border);
            margin-bottom: 12px;
        }

        .metric-box {
            text-align: center;
            background: #090909;
            padding: 8px;
            border-radius: 6px;
        }

        .metric-box span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .metric-box strong {
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .historico-section {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .historico-tag {
            background: #181818;
            padding: 2px 6px;
            border-radius: 4px;
            color: #aaa;
        }

        @media (max-width: 600px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            
            .atleta-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Scout Exclusivo <span>Náutico</span></h1>
        <p id="subtitulo-atualizacao">Carregando dados...</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Pesquisar atleta por nome ou posição..." onkeyup="filtrarAtletas()">
    </div>

    <div id="atletas-container">
        <!-- Os atletas serão injetados aqui -->
    </div>

    <script>
        // Dados dos atletas incorporados diretamente
        const dados = {
            "ultima_atualizacao": "2026-08-24 - Náutico vs Sport",
            "atletas": [
                {
                    "atleta_id": "joao_silva",
                    "nome": "João Silva",
                    "posicao": "Meia",
                    "ultima_partida": {
                        "adversario": "Sport",
                        "data": "2026-08-24",
                        "defensiva": 15,
                        "criativa": 45,
                        "ofensiva": 20,
                        "geral": 32
                    },
                    "historico_geral": [28, 35, 30, 28, 25]
                },
                {
                    "atleta_id": "carlos_santos",
                    "nome": "Carlos Santos",
                    "posicao": "Zagueiro",
                    "ultima_partida": {
                        "adversario": "Sport",
                        "data": "2026-08-24",
                        "defensiva": 75,
                        "criativa": 30,
                        "ofensiva": 10,
                        "geral": 48
                    },
                    "historico_geral": [45, 50, 48, 52, 46]
                },
                {
                    "atleta_id": "bruno_costa",
                    "nome": "Bruno Costa",
                    "posicao": "Atacante",
                    "ultima_partida": {
                        "adversario": "Sport",
                        "data": "2026-08-24",
                        "defensiva": 20,
                        "criativa": 55,
                        "ofensiva": 80,
                        "geral": 65
                    },
                    "historico_geral": [60, 65, 70, 58, 62]
                },
                {
                    "atleta_id": "felipe_oliveira",
                    "nome": "Felipe Oliveira",
                    "posicao": "Lateral Direito",
                    "ultima_partida": {
                        "adversario": "Sport",
                        "data": "2026-08-24",
                        "defensiva": 55,
                        "criativa": 40,
                        "ofensiva": 35,
                        "geral": 44
                    },
                    "historico_geral": [40, 42, 45, 43, 41]
                }
            ]
        };

        let listaAtletas = [];

        function inicializar() {
            document.getElementById('subtitulo-atualizacao').innerText = `Referência: ${dados.ultima_atualizacao}`;
            listaAtletas = dados.atletas;
            renderizarAtletas(listaAtletas);
        }

        function renderizarAtletas(atletas) {
            const container = document.getElementById('atletas-container');
            container.innerHTML = '';

            if (atletas.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 20px;">Nenhum atleta encontrado.</p>';
                return;
            }

            atletas.forEach(atleta => {
                const historicoHtml = atleta.historico_geral.map(val => `<span class="historico-tag">${val}%</span>`).join('');

                const card = document.createElement('div');
                card.className = 'atleta-card';
                card.innerHTML = `
                    <div class="atleta-header">
                        <div class="atleta-info">
                            <h3>${atleta.nome}</h3>
                            <span>${atleta.posicao}</span>
                        </div>
                        <div class="atleta-geral-badge" title="Contribuição Média no Jogo">
                            ${atleta.ultima_partida.geral}% Geral
                        </div>
                    </div>
                    
                    <div class="metrics-grid">
                        <div class="metric-box">
                            <span>Defensiva</span>
                            <strong>${atleta.ultima_partida.defensiva}%</strong>
                        </div>
                        <div class="metric-box">
                            <span>Criativa</span>
                            <strong>${atleta.ultima_partida.criativa}%</strong>
                        </div>
                        <div class="metric-box">
                            <span>Ofensiva</span>
                            <strong>${atleta.ultima_partida.ofensiva}%</strong>
                        </div>
                    </div>

                    <div class="historico-section">
                        <span>Histórico Geral:</span>
                        ${historicoHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filtrarAtletas() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = listaAtletas.filter(atleta => 
                atleta.nome.toLowerCase().includes(termo) || 
                atleta.posicao.toLowerCase().includes(termo)
            );
            renderizarAtletas(filtrados);
        }

        // Inicializa ao carregar a página
        window.addEventListener('DOMContentLoaded', inicializar);
        inicializar();
    </script>
</body>
</html>
