<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout Exclusivo | Náutico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --card-border: #222222;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --neon-red: #ff1e38;
            --neon-glow: rgba(255, 30, 56, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0 20px 0;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-glow);
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .search-container {
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            padding: 14px 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            border-color: var(--neon-red);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .atleta-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }

        .atleta-card:hover {
            border-color: #444;
        }

        .atleta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .atleta-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .atleta-info span {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .atleta-geral-badge {
            background: rgba(255, 30, 56, 0.1);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 0 8px var(--neon-glow);
            white-space: nowrap;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--card-border);
            margin-bottom: 12px;
        }

        .metric-box {
            text-align: center;
            background: #090909;
            padding: 8px;
            border-radius: 6px;
        }

        .metric-box span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .metric-box strong {
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .ultimos-jogos-section {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .jogo-tag {
            background: #181818;
            padding: 2px 6px;
            border-radius: 4px;
            color: #aaa;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* --- ESTILOS DA CAIXA FLUTUANTE DE ANÚNCIO --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-content {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        .btn-fechar {
            position: absolute;
            top: -12px;
            right: -12px;
            background-color: var(--neon-red);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .btn-fechar:hover {
            transform: scale(1.1);
        }
        /* --------------------------------------------- */

<script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>


        @media (max-width: 600px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .atleta-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div id="anuncioModal" class="modal-overlay">
        <div class="modal-content">
            <button class="btn-fechar" onclick="fecharAnuncio()">×</button>
            <script>
              atOptions = {
                'key' : 'b3549806fa0a3c50dbc2f3e421a0ed37',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
            </script>
            <script <script type="text/javascript">
    aclib.runAutoTag({
        zoneId: 'w5bpbxs86g',
    });
</script>
"></script>
        </div>
    </div>
    <header>
        <h1>Scout Exclusivo <span>Náutico</span></h1>
        <p id="subtitulo-atualizacao">Carregando dados...</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Pesquisar atleta por nome ou posição..." onkeyup="filtrarAtletas()">
    </div>

    <div id="atletas-container">
        <p class="loading">Carregando atletas...</p>
    </div>

    <script>
        let listaAtletas = [];

        async function carregarDados() {
            try {
                const urlGitHub = 'https://raw.githubusercontent.com/mac-play/nautico-data6/main/dados.json?t=' + new Date().getTime();
                const resposta = await fetch(urlGitHub);
                if (!resposta.ok) throw new Error('HTTP ' + resposta.status);

                const dados = await resposta.json();
                document.getElementById('subtitulo-atualizacao').innerText = `Referência: ${dados.ultima_atualizacao}`;
                listaAtletas = dados.atletas;
                renderizarAtletas(listaAtletas);
            } catch (erro) {
                console.error('Erro:', erro);
                document.getElementById('subtitulo-atualizacao').innerText = 'Erro ao carregar dados.';
                document.getElementById('atletas-container').innerHTML = '<p class="loading">❌ Erro ao carregar dados. Verifique sua conexão.</p>';
            }
        }

        function renderizarAtletas(atletas) {
            const container = document.getElementById('atletas-container');
            container.innerHTML = '';

            if (atletas.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 20px;">Nenhum atleta encontrado.</p>';
                return;
            }

            atletas.forEach(atleta => {
                const ultimosJogosHtml = atleta.ultimos_5_jogos.map(val => `<span class="jogo-tag">${val}%</span>`).join('');

                // Verificar se é goleiro
                const isGoleiro = atleta.posicao === "Goleiro";
                
                let metricsHtml = '';
                if (isGoleiro) {
                    metricsHtml = `
                        <div class="metric-box">
                            <span>Participação<br>Defensiva</span>
                            <strong>${atleta.ultima_partida.participacao_defensiva}%</strong>
                        </div>
                        <div class="metric-box">
                            <span>Participação<br>Criativa</span>
                            <strong>${atleta.ultima_partida.participacao_criativa}%</strong>
                        </div>
                        <div class="metric-box">
                            <span>Segurança</span>
                            <strong>${atleta.ultima_partida.seguranca}%</strong>
                        </div>
                    `;
                } else {
                    metricsHtml = `
                        <div class="metric-box">
                            <span>Participação<br>Defensiva</span>
                            <strong>${atleta.ultima_partida.participacao_defensiva}%</strong>
                        </div>
                        <div class="metric-box">
                            <span>Participação<br>Criativa</span>
                            <strong>${atleta.ultima_partida.participacao_criativa}%</strong>
                        </div>
                        <div class="metric-box">
                            <span>Participação<br>Ofensiva</span>
                            <strong>${atleta.ultima_partida.participacao_ofensiva}%</strong>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = 'atleta-card';
                card.innerHTML = `
                    <div class="atleta-header">
                        <div class="atleta-info">
                            <h3>${atleta.nome}</h3>
                            <span>${atleta.posicao}</span>
                        </div>
                        <div class="atleta-geral-badge">
                            ${atleta.ultima_partida.geral}% Geral
                        </div>
                    </div>
                    
                    <div class="metrics-grid">
                        ${metricsHtml}
                    </div>

                    <div class="ultimos-jogos-section">
                        <span>Últimos 5 Jogos:</span>
                        ${ultimosJogosHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filtrarAtletas() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = listaAtletas.filter(atleta => 
                atleta.nome.toLowerCase().includes(termo) || 
                atleta.posicao.toLowerCase().includes(termo)
            );
            renderizarAtletas(filtrados);
        }

        // Função para fechar o anúncio
        function fecharAnuncio() {
            const modal = document.getElementById('anuncioModal');
            modal.classList.add('hidden');
        }

        // Carrega os dados ao abrir a página
        carregarDados();
    </script>
</body>
</html>
